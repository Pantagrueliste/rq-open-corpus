name: validate-submission
on:
  pull_request:
    paths: ["submissions/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Validate submitted JSONL
        run: python scripts/validate_submission.py $(git diff --name-only origin/${{ github.base_ref }} -- 'submissions/**/*.jsonl' | tr '\n' ' ')
