table{border-collapse:collapse;width:100%;font-size:13px}

td{padding:6.5px 10px;border-bottom:1px solid var(--hair);white-space:nowrap}
tr:hover td{background:var(--chipbg)}
.b{font-weight:600}
.badge{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.03em;border-radius:5px;padding:2px 7px}

.axis{stroke:var(--hair)}
.gridl{stroke:var(--hair);stroke-dasharray:0}
.mutl{fill:var(--mut)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:7px;

/* ---------- utilities ---------- */
const $ = s => document.querySelector(s);
const fmt = n => n == null ? '—' : n.toLocaleString('fr-FR');
const fmtW = n => n >= 1e9 ? (n/1e9).toFixed(2)+' Md' : n >= 1e6 ? (n/1e6).toFixed(1)+' M' : fmt(n);
const fx = v => v == null ? '—' : (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(v >= 1 ? 2 : 3)) + '×';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tip = $('#tip');
function showTip(ev, html){ tip.innerHTML = html; tip.style.opacity = 1;
  const x = Math.min(ev.clientX + 14, innerWidth - 340), y = Math.min(ev.clientY + 12, innerHeight - 90);
  tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
function hideTip(){ tip.style.opacity = 0; }
document.addEventListener('scroll', hideTip, true);
const VLABEL = {citable:'citable', 'citable-gated':'citable · gating', 'citable-tier':'citable · tier',
  'lower-bound':'borne inférieure', 'no-multiplier':'PAS de multiplicateur', special:'hors USTC',

function idxChart(){
  const key = state.unit;
  const rows = DATA.languages.filter(l => l.class === 'european_print' && l[key] != null && (key !== 'idxPrint' || l.printGrade === 'yes'))
    .sort((a,b) => a[key] - b[key]);
  const W = 940, rowH = 21, H = rows.length * rowH + 46, L = 110, R = 60;
  const lo = Math.min(...rows.map(r => r[key]), 0.05), hi = Math.max(...rows.map(r => r[key]), 10);
  const X = v => L + (Math.log10(v) - Math.log10(lo * .8)) / (Math.log10(hi * 1.3) - Math.log10(lo * .8)) * (W - L - R);
  let g = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">`;
  [0.1, 0.3, 1, 3, 10, 30].filter(t => t > lo*.8 && t < hi*1.3).forEach(t => {
    g += `<line class="gridl" x1="${X(t)}" y1="18" x2="${X(t)}" y2="${H-24}"/>`+
         `<text class="mutl" x="${X(t)}" y="${H-8}" font-size="10.5" text-anchor="middle">${t}×</text>`;});
  g += `<line x1="${X(1)}" y1="18" x2="${X(1)}" y2="${H-24}" stroke="var(--mut)" stroke-dasharray="4 3"/>`;
  rows.forEach((r, i) => {
    const y = 20 + i * rowH, v = r[key], x0 = X(1), x1 = X(v);
    const c = v >= 1 ? 'var(--acc2)' : 'var(--acc)';
    g += `<text x="${L-8}" y="${y+11}" font-size="11.5" text-anchor="end">${esc(r.name)}</text>`+
      `<rect data-iso="${r.iso}" x="${Math.min(x0,x1)}" y="${y+3}" width="${Math.max(Math.abs(x1-x0),2)}" height="12" rx="3" fill="${c}"/>`+
      `<text class="mutl" x="${x1 + (v>=1?5:-5)}" y="${y+12.5}" font-size="10" text-anchor="${v>=1?'start':'end'}">${fx(v)}</text>`;});
  g += `</svg>`;
  $('#idxChart').innerHTML = g;
  $('#idxChart').querySelectorAll('rect').forEach(el => {
    const r = DATA.languages.find(l => l.iso === el.dataset.iso);
    el.addEventListener('mousemove', ev => showTip(ev,
      `<b>${esc(r.name)}</b> — ${VLABEL[r.verdict]}<br>mots ${fx(r.idx)} · œuvres ${fx(r.idxWorks)} · imprimés ${fx(r.idxPrint)}${r.printGrade!=='yes'?' <i>(non fiable : médium non étiqueté)</i>':''}<br>${fmtW(r.words)} mots · ${fmt(r.editions)} éditions USTC<br><i>${esc(r.claim)}</i>`));
    el.addEventListener('mouseleave', hideTip);});
}
function langTable(){
  const [k, dir] = state.langSort;
  const rows = [...DATA.languages].sort((a,b) => (((a[k]==null)-(b[k]==null)) || (a[k]>b[k]?1:-1)) * dir);
  const cols = [['name','langue'],['class','strate'],['texts','textes'],['words','mots'],['wshare','% mots'],
    ['editions','éditions'],['idx','index'],['idxWorks','œuvres'],['idxPrint','imprimés'],['digPct','% imagé'],['verdict','plafond']];
  let h = '<table><thead><tr>' + cols.map(([ck,cl]) =>
    `<th data-k="${ck}" class="${typeof DATA.languages[0][ck]==='number'?'num':''}">${cl}${k===ck?(dir<0?' ↓':' ↑'):''}</th>`).join('') + '</tr></thead><tbody>';
  rows.forEach(r => { h += `<tr data-iso="${r.iso}">
    <td class="b">${esc(r.name)}</td><td class="mutl" style="color:var(--mut)">${r.class==='european_print'?'index':r.class==='outside_ustc_universe'?'hors USTC':'présence'}</td>
    <td class="num">${fmt(r.texts)}</td><td class="num">${fmtW(r.words)}</td><td class="num">${r.wshare.toFixed(2)}</td>
    <td class="num">${fmt(r.editions)}</td><td class="num">${fx(r.idx)}</td><td class="num">${fx(r.idxWorks)}</td>
    <td class="num">${r.printGrade==='yes'?fx(r.idxPrint):'—'}</td><td class="num">${r.digPct!=null?r.digPct+' %':'—'}</td>
    <td><span class="badge v-${r.verdict}">${VLABEL[r.verdict]}</span></td></tr>`; });
  $('#langTable').innerHTML = h + '</tbody></table>';
  $('#langTable').querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
    state.langSort = [th.dataset.k, state.langSort[0] === th.dataset.k ? -state.langSort[1] : -1]; langTable(); }));
  $('#langTable').querySelectorAll('tr[data-iso]').forEach(tr => {
    const r = DATA.languages.find(l => l.iso === tr.dataset.iso);
    tr.addEventListener('mousemove', ev => showTip(ev, `<b>${esc(r.name)}</b><br><i>${esc(r.claim)}</i>`));
    tr.addEventListener('mouseleave', hideTip);});
}

function bandChart(){
  const BANDS = ['1450–99','1500–99','1600–40','1641–1700'];
  const sel = DATA.languages.filter(l => state.bandsSel.includes(l.iso));
  const W = 900, H = 360, L = 56, B = 34, T = 16;
  const vals = sel.flatMap(l => l.bands).filter(v => v != null);
  const lo = Math.min(...vals, .05)*.7, hi = Math.max(...vals, 2)*1.4;
  const X = i => L + i * (W - L - 30) / 3, Y = v => T + (1 - (Math.log10(v)-Math.log10(lo))/(Math.log10(hi)-Math.log10(lo))) * (H-T-B);
  let g = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">`;
  [0.1,0.3,1,3,10,30].filter(t=>t>lo&&t<hi).forEach(t => g +=
    `<line class="gridl" x1="${L}" y1="${Y(t)}" x2="${W-30}" y2="${Y(t)}"/><text class="mutl" x="${L-6}" y="${Y(t)+4}" font-size="10.5" text-anchor="end">${t}×</text>`);
  g += `<line x1="${L}" y1="${Y(1)}" x2="${W-30}" y2="${Y(1)}" stroke="var(--mut)" stroke-dasharray="4 3"/>`;
  BANDS.forEach((b,i) => g += `<text class="mutl" x="${X(i)}" y="${H-8}" font-size="11" text-anchor="middle">${b}</text>`);
  const palette = ['#c0492f','#0e6ba8','#3f8f6b','#8a5fb0','#b0803a','#527687','#a84a72','#6b7684'];
  sel.forEach((l, si) => {
    const c = l.iso==='eng' ? 'var(--acc2)' : palette[si % palette.length];
    const pts = l.bands.map((v,i) => v!=null ? [X(i),Y(v),v,i] : null).filter(Boolean);
    g += `<polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/>`;
    pts.forEach(p => g += `<circle data-iso="${l.iso}" data-b="${p[3]}" cx="${p[0]}" cy="${p[1]}" r="5" fill="${c}" stroke="var(--panel)" stroke-width="1.5"/>`);
    const last = pts[pts.length-1];
    if(last) g += `<text x="${last[0]+9}" y="${last[1]+4}" font-size="11.5" fill="${c}" font-weight="600">${esc(l.name)}</text>`;});
  g += `</svg>`;
  $('#bandChart').innerHTML = g;
  $('#bandChart').querySelectorAll('circle').forEach(el => {
    const l = DATA.languages.find(x => x.iso === el.dataset.iso), b = +el.dataset.b;
    el.addEventListener('mousemove', ev => showTip(ev, `<b>${esc(l.name)}</b> · ${['1450–99','1500–99','1600–40','1641–1700'][b]}<br>index ${fx(l.bands[b])}`));
    el.addEventListener('mouseleave', hideTip);});
}
function decChart(){
  const {langs, rows} = DATA.decades;
  const NAME = {eng:'anglais',lat:'latin',ara:'arabe',fra:'français',ita:'italien',deu:'allemand',spa:'espagnol',nld:'néerlandais',other:'autres'};
  const W = 900, H = 300, L = 60, B = 30, T = 12;
  const totals = rows.map(r => r.slice(1).reduce((a,b)=>a+b,0));
  const hi = Math.max(...totals)*1.06;
  const X = i => L + i*(W-L-16)/(rows.length-1), Y = v => T + (1-v/hi)*(H-T-B);
  const cols = ['#c0492f','#0e6ba8','#3f8f6b','#8a5fb0','#b0803a','#527687','#a84a72','#7aa0b8','#c9c5bb'];
  let g = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">`;
  [0.5e9, 1e9].filter(t=>t<hi).forEach(t => g += `<line class="gridl" x1="${L}" y1="${Y(t)}" x2="${W-16}" y2="${Y(t)}"/><text class="mutl" x="${L-6}" y="${Y(t)+4}" font-size="10.5" text-anchor="end">${t/1e9} Md</text>`);
  let base = rows.map(()=>0);
  langs.forEach((lg, li) => {
    let up = rows.map((r,i) => base[i] + r[li+1]);
    let path = rows.map((r,i)=>`${X(i)},${Y(up[i])}`).join(' L') ;
    let back = rows.map((r,i)=>`${X(rows.length-1-i)},${Y(base[rows.length-1-i])}`).join(' L');
    g += `<path d="M${path} L${back} Z" fill="${cols[li]}" opacity="0.88" data-lg="${lg}" stroke="var(--panel)" stroke-width="1"/>`;
    base = up;});
  rows.forEach((r,i) => { if(r[0]%50===0) g += `<text class="mutl" x="${X(i)}" y="${H-8}" font-size="10.5" text-anchor="middle">${r[0]}</text>`;});
  g += `</svg><div class="controls" style="margin-top:6px">` +
    langs.map((lg,li)=>`<span class="chip" style="cursor:default"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${cols[li]};margin-right:6px"></span>${NAME[lg]||lg}</span>`).join('') + `</div>`;
  $('#decChart').innerHTML = g;
  $('#decChart').querySelectorAll('path').forEach(p => {
    p.addEventListener('mousemove', ev => {
      const box = p.closest('svg').getBoundingClientRect();
      const i = Math.round((ev.clientX-box.left)/box.width*(rows.length-1));
      const r = rows[Math.max(0,Math.min(rows.length-1,i))];
      const li = langs.indexOf(p.dataset.lg);
      showTip(ev, `<b>${NAME[p.dataset.lg]||p.dataset.lg}</b> · années ${r[0]}<br>${fmtW(r[li+1])} mots (décennie totale ${fmtW(r.slice(1).reduce((a,b)=>a+b,0))})`);});
    p.addEventListener('mouseleave', hideTip);});
}

/* ---------- ③ IMAGÉ ---------- */
views.imaged = () => `<h2>Imagé ≠ lisible — les quatre corpus</h2>
  <p class="lede">X : % des éditions d'une langue portant un lien fac-similé dans l'USTC (facette « digitised », tirage 2026-07-16).
  Y : index de représentation en texte transcrit (log). La taille ∝ éditions survivantes. L'équilibre fac-similaire, mesuré depuis le catalogue du champ.</p>
  <div class="card"><div id="scatter"></div>
  <p class="note">* la cellule française sous-compte Gallica (liens connus de l'USTC seulement). Langues ≥ 4 000 éditions.</p></div>
  <div class="card"><h3>Fac-similés → corpus sale → corpus propre → bibliothèque de l'ombre</h3>
  <p class="note">Le ratio sale/propre mesure combien du record ingérable d'une langue est de l'OCR non édité. Le corpus sale = PleIAs in-window + réservoir EEB/IA (brut, borne inférieure, 8 langues PleIAs) ; l'ombre se mesure en notices, pas en mots.</p>
  <div id="tierTable"></div></div>`;
function scatter(){
  const rows = DATA.languages.filter(l => l.digPct != null && l.editions >= 4000 && l.idx != null);
  const W = 920, H = 480, L = 64, B = 46, T = 16;
  const X = v => L + v/68*(W-L-20);
  const lo = .09, hi = 13;
  const Y = v => T + (1-(Math.log10(v)-Math.log10(lo))/(Math.log10(hi)-Math.log10(lo)))*(H-T-B);
  let g = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">`;
  [0.1,0.2,0.3,0.5,1,2,3,5,8].forEach(t => g += `<line class="gridl" x1="${L}" y1="${Y(t)}" x2="${W-20}" y2="${Y(t)}"/><text class="mutl" x="${L-6}" y="${Y(t)+4}" font-size="10.5" text-anchor="end">${t}×</text>`);
  [10,20,30,40,50,60].forEach(t => g += `<line class="gridl" x1="${X(t)}" y1="${T}" x2="${X(t)}" y2="${H-B}"/><text class="mutl" x="${X(t)}" y="${H-B+16}" font-size="10.5" text-anchor="middle">${t} %</text>`);
  g += `<line x1="${L}" y1="${Y(1)}" x2="${W-20}" y2="${Y(1)}" stroke="var(--mut)" stroke-dasharray="4 3"/>`;
  g += `<text class="mutl" x="${(W+L)/2}" y="${H-6}" font-size="11.5" text-anchor="middle">éditions imagées dans l'USTC (%)</text>`;
  rows.forEach(r => {
    const hot = r.iso==='deu'||r.iso==='eng';
    const c = r.iso==='eng' ? 'var(--acc2)' : hot ? 'var(--acc)' : 'var(--gray)';
    g += `<circle data-iso="${r.iso}" cx="${X(r.digPct)}" cy="${Y(r.idx)}" r="${Math.max(6, Math.min(17, Math.sqrt(r.editions)/45))}" fill="${c}" opacity="${hot?1:.55}" stroke="var(--panel)" stroke-width="1.6"/>`+
    `<text x="${X(r.digPct)}" y="${Y(r.idx)-Math.max(6,Math.min(17,Math.sqrt(r.editions)/45))-4}" font-size="${hot?11.5:10}" text-anchor="middle" ${hot?'font-weight="700"':''} ${hot?'':'fill="var(--mut)"'}>${esc(r.name)}${r.iso==='fra'?'*':''}</text>`;});
  g += `</svg>`;
  $('#scatter').innerHTML = g;
  $('#scatter').querySelectorAll('circle').forEach(el => {
    const r = DATA.languages.find(l => l.iso === el.dataset.iso);
    el.addEventListener('mousemove', ev => showTip(ev, `<b>${esc(r.name)}</b><br>${fmt(r.digEditions)} / ${fmt(r.editions)} éditions imagées (${r.digPct} %)<br>index texte transcrit : ${fx(r.idx)}<br><i>${esc(r.claim)}</i>`));
    el.addEventListener('mouseleave', hideTip);});
}

function tierTable(){
  const rows = DATA.tiers.filter(t => t.clean > 200000 || t.dirty > 40000000).slice(0, 12);
  const maxR = 60; // bar cap; Greek annotated numerically
  let h = '<table><thead><tr><th>langue</th><th class="num">% imagé (USTC)</th><th class="num">corpus sale (mots bruts)</th><th class="num">corpus propre (mots)</th><th class="num">sale/propre</th><th>—</th></tr></thead><tbody>';
  rows.forEach(t => {
    const r = t.ratio, w = r ? Math.min(r, maxR) / maxR * 160 : 0;
    h += `<tr data-iso="${t.iso}"><td class="b">${esc(t.language)}</td>
      <td class="num">${t.imaged != null ? t.imaged + ' %' : '—'}</td>
      <td class="num">${fmtW(t.dirty)}</td><td class="num">${fmtW(t.clean)}</td>
      <td class="num b">${r ? (r >= 100 ? '~' + Math.round(r/100)*100 : r) + '×' : '—'}</td>
      <td><span style="display:inline-block;height:10px;border-radius:3px;background:${r > 10 ? 'var(--acc2)' : 'var(--acc)'};width:${w}px"></span></td></tr>`;});
  $('#tierTable').innerHTML = h + '</tbody></table>';
  $('#tierTable').querySelectorAll('tr[data-iso]').forEach(tr => {
    const t = DATA.tiers.find(x => x.iso === tr.dataset.iso);
    tr.addEventListener('mousemove', ev => showTip(ev,
      `<b>${esc(t.language)}</b><br>sale : ${fmt(t.dirty)} mots bruts (PleIAs + EEB/IA)<br>propre : ${fmt(t.clean)} mots transcrits<br>${t.ratio ? 'ratio ' + t.ratio + '× — ' + (t.ratio > 10 ? 'scannée-puis-océrisée' : 'claviée') : ''}`));
    tr.addEventListener('mouseleave', hideTip);});
}

/* ---------- ④ SUBSTRATS ---------- */
views.substrates = () => `<h2>Les quatre substrats</h2>
  <p class="lede">La même Renaissance dans quatre couches : l'imprimé (USTC), le corpus ouvert, la bibliothèque pirate (Z-Library),
  le corpus d'entraînement ouvert (Common Corpus). Rangs comparables entre couches ; pourcentages valables à l'intérieur d'une couche seulement.</p>
  <div class="card"><h3>Rang par substrat — survolez une langue</h3><div id="bump"></div></div>
  <div class="card"><h3>Parts exactes (%)</h3><div id="subTable"></div>
  <p class="note">Unités : éditions / mots / <i>notices</i> / mots — jamais d'arithmétique entre colonnes. Latin : 31,9 → 8,7 → 0,02 → 44,1. C'est la langue qui bascule.</p></div>`;
function bump(){
  const S = DATA.substrates, n = S.names.length;
  const ranks = S.names.map((_,si) => { const order=[...S.langs].sort((a,b)=>S.shares[b][si]-S.shares[a][si]);
    return Object.fromEntries(order.map((l,i)=>[l,i+1])); });
  const W=880,H=330,L=90,R=90,T=24,B=54;
  const X=i=>L+i*(W-L-R)/(n-1), Y=r=>T+(r-1)*(H-T-B)/5;
  let g=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">`;
  for(let r=1;r<=6;r++) g+=`<text class="mutl" x="${L-58}" y="${Y(r)+4}" font-size="10.5">#${r}</text><line class="gridl" x1="${L-20}" y1="${Y(r)}" x2="${W-R+20}" y2="${Y(r)}"/>`;
  S.names.forEach((nm,i)=>g+=`<text class="mutl" x="${X(i)}" y="${H-30}" font-size="10.5" text-anchor="middle">${nm.split(' (')[0]}</text><text class="mutl" x="${X(i)}" y="${H-16}" font-size="9.5" text-anchor="middle">(${nm.split(' (')[1]||''}</text>`);
  S.langs.forEach(l=>{
    const hot=l==='English'||l==='Latin', c=l==='English'?'var(--acc2)':l==='Latin'?'var(--acc)':'var(--gray)';
    const pts=S.names.map((_,i)=>[X(i),Y(ranks[i][l])]);
    g+=`<g class="bumpline" data-l="${l}" style="cursor:pointer">`+
      `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="${hot?3:2}" opacity="${hot?1:.45}" stroke-linecap="round"/>`+
      pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="${c}" opacity="${hot?1:.55}" stroke="var(--panel)" stroke-width="1.6"/>`).join('')+
      `<text x="${pts[0][0]-10}" y="${pts[0][1]+4}" font-size="11" text-anchor="end" ${hot?'font-weight="700"':'fill="var(--mut)"'}>${l}</text>`+
      `<text x="${pts[n-1][0]+10}" y="${pts[n-1][1]+4}" font-size="11" ${hot?'font-weight="700"':'fill="var(--mut)"'}>${l}</text></g>`;});
  g+=`</svg>`;
  $('#bump').innerHTML=g;
  $('#bump').querySelectorAll('.bumpline').forEach(el=>{
    const l=el.dataset.l;
    el.addEventListener('mousemove',ev=>{ el.querySelector('polyline').setAttribute('opacity',1);
      showTip(ev,`<b>${l}</b><br>`+S.names.map((nm,i)=>`${nm.split(' (')[0]} : <b>${S.shares[l][i]}%</b> (#${(()=>{const o=[...S.langs].sort((a,b)=>S.shares[b][i]-S.shares[a][i]);return o.indexOf(l)+1})()})`).join('<br>'));});
    el.addEventListener('mouseleave',()=>{ hideTip(); if(l!=='English'&&l!=='Latin') el.querySelector('polyline').setAttribute('opacity',.45);});});
}
function subTable(){
  const S=DATA.substrates;
  let h='<table><thead><tr><th>langue</th>'+S.names.map(n=>`<th class="num">${n}</th>`).join('')+'</tr></thead><tbody>';
  S.langs.forEach(l=>{h+=`<tr><td class="b">${l}</td>`+S.shares[l].map(v=>`<td class="num">${v.toLocaleString('fr-FR')}</td>`).join('')+'</tr>';});
  $('#subTable').innerHTML=h+'</tbody></table>';
}

/* ---------- ⑤ CORPUS ---------- */
views.corpus = () => {
  const s = DATA.summary, m = s.media;
  const totM = Object.values(m).reduce((a,b)=>a+b,0);
  return `<h2>Le corpus</h2>
  <p class="lede">Les 273 collections du niveau ouvert. Recherchez, triez ; la colonne « diffusion » reflète la version publiée (T1 libre / T2 NC / T3 recette).</p>
  <div class="stats">
    <div class="stat"><b>${s.eeboCorpusPct} %</b><span>EEBO seul (2 collections)</span></div>
    <div class="stat"><b>${s.medianYear}</b><span>mot médian</span></div>
    <div class="stat"><b>${(m.print/totM*100).toFixed(1)} %</b><span>imprimé (mots)</span></div>
    <div class="stat"><b>${s.women}</b><span>textes de femmes (0,168 %)</span></div>
  </div>
  <div class="card"><h3>Collections</h3>
  <div class="controls"><input type="search" id="collQ" placeholder="filtrer… (ex. EEBO, DBNL, Wikisource)" value="${esc(state.collQ)}"></div>
  <div id="collTable"></div></div>`;
};
function collTable(){
  const q = state.collQ.toLowerCase();
  const [k, dir] = state.collSort;
  const rows = DATA.collections.filter(c => !q || c.name.toLowerCase().includes(q) || c.topLang.includes(q))
    .sort((a,b) => ((a[k]>b[k]?1:-1)) * dir);
  const cols = [['name','collection'],['texts','textes'],['words','mots'],['topLang','langue dom.'],['nLangs','langues'],['tier','diffusion'],['status','statut publié']];
  let h = '<table><thead><tr>'+cols.map(([ck,cl])=>`<th data-k="${ck}" class="${['texts','words','nLangs'].includes(ck)?'num':''}">${cl}${k===ck?(dir<0?' ↓':' ↑'):''}</th>`).join('')+'</tr></thead><tbody>';
  rows.slice(0,300).forEach(c => h += `<tr><td class="b">${esc(c.name)}</td><td class="num">${fmt(c.texts)}</td><td class="num">${fmtW(c.words)}</td><td>${esc(c.topLang)}</td><td class="num">${c.nLangs}</td><td><span class="badge ${c.tier==='T1'?'v-citable':c.tier==='T2'?'v-lower-bound':'v-no-multiplier'}">${c.tier}</span></td><td style="font-size:11.5px;color:var(--mut)">${esc((c.status||'').split(' (')[0])}</td></tr>`);
  $('#collTable').innerHTML = h+'</tbody></table>';
  $('#collTable').querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{
    state.collSort=[th.dataset.k, state.collSort[0]===th.dataset.k?-state.collSort[1]:-1]; collTable();}));
}

/* ---------- ⑥ AFFIRMATIONS ---------- */
views.claims = () => `<h2>Affirmations citables</h2>
  <p class="lede">Les faits prêts à l'emploi, chacun avec sa source ; puis, langue par langue, ce que les données autorisent à affirmer — et pas davantage.</p>
  ${DATA.quotables.map((f,i)=>`<div class="quote"><button class="copy" data-i="${i}">copier</button><h4>${esc(f.t)}</h4><p>${esc(f.q)}</p><div class="src">${esc(f.s)}</div></div>`).join('')}
  <div class="card"><h3>Plafonds de revendication par langue</h3><table><thead><tr><th>langue</th><th>plafond</th><th>ce qu'on peut affirmer</th></tr></thead><tbody>
  ${DATA.languages.filter(l=>['citable','citable-gated','citable-tier','lower-bound','no-multiplier','special'].includes(l.verdict))
    .map(l=>`<tr><td class="b">${esc(l.name)}</td><td><span class="badge v-${l.verdict}">${VLABEL[l.verdict]}</span></td><td style="white-space:normal;max-width:640px">${esc(l.claim)}</td></tr>`).join('')}
  </tbody></table></div>`;

/* ---------- wiring ---------- */
function wire(v){
  if(v==='index'){ idxChart(); langTable();
    document.querySelectorAll('[data-u]').forEach(b=>b.addEventListener('click',()=>{state.unit=b.dataset.u; render('index');})); }
  if(v==='bands'){ bandChart(); decChart();
    $('#bandChips').querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
      const i=c.dataset.iso, s=state.bandsSel;
      state.bandsSel = s.includes(i) ? s.filter(x=>x!==i) : [...s,i].slice(-8);
      render('bands');}));}
  if(v==='imaged'){ scatter(); tierTable(); }
  if(v==='substrates'){ bump(); subTable(); }
  if(v==='corpus'){ collTable();
    $('#collQ').addEventListener('input',e=>{state.collQ=e.target.value; collTable();}); }
  if(v==='claims') document.querySelectorAll('.copy').forEach(b=>b.addEventListener('click',()=>{
    const f=DATA.quotables[+b.dataset.i];
    navigator.clipboard.writeText(`${f.q} [${f.s}]`).then(()=>{b.textContent='copié ✓'; setTimeout(()=>b.textContent='copier',1400);});}));
}
render('index');

</script>
